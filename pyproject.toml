[project]
name = "elv2mcp"
version = "0.1.0"
description = "Universal MCP adapter for ELV systems"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
elv2mcp = "server:mcp.run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
